name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/phranck/grat/internal/version.buildVersion=${VERSION}" \
            -o "dist/grat_${VERSION}_${GOOS}_${GOARCH}" ./cmd/grat
      - name: Attest release binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/grat_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate the manual pages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x "dist/grat_${TAG}_linux_amd64"
          "dist/grat_${TAG}_linux_amd64" manual > dist/grat.1
          "dist/grat_${TAG}_linux_amd64" manual grat.config > dist/grat.config.7
          test -s dist/grat.1
          test -s dist/grat.config.7
      - name: Package Homebrew bottles
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/build-homebrew-bottles.sh --version "$TAG" --input dist --output bottles
      - name: Create checksums
        run: |
          find dist bottles -type f \( -name 'grat_*' -o -name 'grat.1' -o -name 'grat.config.7' -o -name '*.bottle.tar.gz' \) | sort | xargs sha256sum | sed 's#  \(dist\|bottles\)/#  #' > dist/checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* bottles/* --clobber
          else
            # GitHub ends every generated line with "by @user in #N" and offers no
            # way to leave that out, so the notes are generated through the API,
            # the attribution is taken off, and the result is passed as the notes
            # rather than letting GitHub write them directly.
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body \
              | sed -E 's/ by @[A-Za-z0-9_-]+ in / in /g' > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "no release notes were generated for $TAG" >&2
              exit 1
            fi
            if grep -q "by @" release-notes.md; then
              echo "the attribution survived; its shape must have changed" >&2
              grep -n "by @" release-notes.md >&2
              exit 1
            fi
            gh release create "$TAG" dist/* bottles/* --title "grat $TAG" --notes-file release-notes.md
          fi
      - name: Verify published Homebrew bottles
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: scripts/verify-homebrew-bottles.sh --version "$TAG" --base-url "$RELEASE_BASE_URL" --input bottles
