name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # CGO_ENABLED is set, so the four binaries are linked the same way. Left
      # unset, Go turns cgo on where it can, and this runner can only do that
      # for Linux: the two Linux binaries came out dynamically linked against
      # the runner's C library whilst the two macOS ones were cross-compiled
      # without one. A pure Go binary also depends on nothing, which is what the
      # README promises of the release file.
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/phranck/grat/internal/version.buildVersion=${VERSION}" \
            -o "dist/grat_${VERSION}_${GOOS}_${GOARCH}" ./cmd/grat
      - name: Attest release binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/grat_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The notes are built from the commits between this tag and the one
          # before it, so the whole history and every tag have to be here.
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate the manual pages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x "dist/grat_${TAG}_linux_amd64"
          "dist/grat_${TAG}_linux_amd64" manual > dist/grat.1
          "dist/grat_${TAG}_linux_amd64" manual grat.config > dist/grat.config.7
          test -s dist/grat.1
          test -s dist/grat.config.7
      - name: Package Homebrew bottles
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/build-homebrew-bottles.sh --version "$TAG" --input dist --output bottles
      - name: Create checksums
        run: |
          find dist bottles -type f \( -name 'grat_*' -o -name 'grat.1' -o -name 'grat.config.7' -o -name '*.bottle.tar.gz' \) | sort | xargs sha256sum | sed 's#  \(dist\|bottles\)/#  #' > dist/checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* bottles/* --clobber
          else
            # The notes are written here rather than generated by GitHub. Its own
            # generator produces one flat list, ends every line with an
            # attribution that cannot be turned off, and can only group by labels
            # that nothing in this project enforces. The commit subjects already
            # carry the grouping.
            sh scripts/release-notes.sh "$TAG" > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "no release notes were built for $TAG" >&2
              exit 1
            fi
            gh release create "$TAG" dist/* bottles/* --title "grat $TAG" --notes-file release-notes.md
          fi
      - name: Verify published Homebrew bottles
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: scripts/verify-homebrew-bottles.sh --version "$TAG" --base-url "$RELEASE_BASE_URL" --input bottles

  # The site reads its version from the newest release, so it is published here,
  # after the release exists. Waiting for the release event instead leaves the
  # site naming the previous version until somebody pushes again, because
  # GitHub raises no workflow run from an event GITHUB_TOKEN caused.
  #
  # A job of its own rather than a step, so the pages permissions stay off the
  # job that writes releases, and it calls the Pages workflow rather than
  # repeating its steps, so there is one definition of how the site is built.
  #
  # This deploys from a tag, so the github-pages environment carries a
  # deployment policy for tags matching v*, beside the ones for main and
  # gh-pages. Without it the environment refuses the deployment and this job
  # fails after the release has already been published.
  site:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
