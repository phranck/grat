name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS ARM
            os: macos-15
          - name: Linux Intel
            os: ubuntu-24.04
          - name: Linux ARM
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Formatting first, because a file that is not gofmt clean makes every
      # diff after it noisy and the check costs nothing.
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: go tool staticcheck ./...
      - name: Tests
        run: go test -race ./...
      - name: Typechecks
        run: go test -run '^$' ./...
      - name: Build
        run: go build -trimpath -o dist/grat ./cmd/grat
      - name: Vulnerability scan
        run: go tool govulncheck ./...
      # The nosec annotations in the code name this tool, so a reader takes them
      # as a record that it ran. Nineteen of them had been written whilst nothing
      # ran it, and five findings nobody had answered were waiting underneath.
      - name: Security scan
        if: matrix.name == 'Linux Intel'
        run: go tool gosec -quiet -exclude-generated ./...
      # Documentation.md is generated from the manual, so this is what stops a
      # change to the manual reaching main without the document following it.
      # The gate existed before and nothing ran it, which is how four wrong
      # statements survived until they were found by hand.
      - name: Documentation
        if: matrix.name == 'Linux Intel'
        run: sh scripts/check-docs.sh
