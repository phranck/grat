name: Security

# A vulnerability is published on a day nobody pushed. The scan in CI runs on a
# push and on a pull request, so a repository left alone for a month stays green
# whilst a dependency turns red underneath it. This asks once a week regardless.
#
# Nothing here reads anything from an event, so there is no untrusted value to
# reach a run step.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Weekly scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Vulnerability scan
        run: go tool govulncheck ./...
      - name: Security scan
        run: go tool gosec -quiet -exclude-generated ./...
